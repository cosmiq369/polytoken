[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polytoken"
version = "0.1.0"
description = "Evidence-backed investigation of Indic AI workload costs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
polytoken = "polytoken.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: requires live Zetaris, NVIDIA, or Hugging Face access (opt in with -m live)"]
