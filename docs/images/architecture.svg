<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" style="color:#13222B;font-family:sans-serif;background:white" viewBox="0 0 1120 520" role="img" aria-label="Architecture: the product lead uses the web UI, which starts an investigation in the PolyToken API. The agent loop, with a Nemotron planner, budget guard, rate limiter and the three Meterless engines, calls five tools. Three tools call NVIDIA models, the SQL tool queries Zetaris, which federates the company database, measurements and reference data. A checker reads the World Model and returns a verified report to the UI. Everything is logged as JSONL." class="d-wide">
<style>/* SVG roles */
.box{fill:#FFFFFF;stroke:#C5D0D5;stroke-width:1.2}
.group{fill:none;stroke:#C5D0D5;stroke-width:1.2;stroke-dasharray:4 4}
.grp-fill{fill:#F3F5F6;stroke:#C5D0D5;stroke-width:1.2}
.ext{fill:#D6EAEB;stroke:#1C6770;stroke-width:1.2}
.key{fill:#F4E5C8;stroke:#A86A12;stroke-width:1.4}
.t{font-size:13px;font-weight:600;fill:currentColor}
.s{font-size:10.5px;fill:#56666F}
.lab{font-size:10.5px;fill:#56666F;font-family:monospace}
.lab-a{font-size:10.5px;fill:#A86A12;font-family:monospace}
.gt{font-size:11px;font-weight:600;fill:#56666F;letter-spacing:.06em;text-transform:uppercase;font-family:monospace}
.edge{fill:none;stroke:currentColor;stroke-width:1.3}
.edge-a{fill:none;stroke:#A86A12;stroke-width:1.6}
.edge-t{fill:none;stroke:#1C6770;stroke-width:1.4}
.edge-d{fill:none;stroke:#56666F;stroke-width:1.2;stroke-dasharray:4 3}
.num{font:700 12px monospace;fill:#A86A12}
.bar{fill:#A86A12}
.bar-ok{fill:#1C6770}
.grid{stroke:#C5D0D5;stroke-width:1}

</style>
<rect width="1120" height="520" fill="white"/>

      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
      </defs>

      <!-- Column A: person and UI -->
      <rect class="box" x="16" y="40" width="170" height="60" rx="8"/>
      <text class="t" x="101" y="66" text-anchor="middle">Product lead</text>
      <text class="s" x="101" y="84" text-anchor="middle">Telugu or Hindi AI product</text>
      <rect class="key" x="16" y="170" width="170" height="80" rx="8"/>
      <text class="t" x="101" y="200" text-anchor="middle">Web UI</text>
      <text class="s" x="101" y="218" text-anchor="middle">timeline · evidence</text>
      <text class="s" x="101" y="232" text-anchor="middle">report · ₹ savings</text>

      <!-- Column B: API, agent loop, checker -->
      <rect class="box" x="240" y="40" width="330" height="50" rx="8"/>
      <text class="t" x="405" y="62" text-anchor="middle">PolyToken API</text>
      <text class="s" x="405" y="78" text-anchor="middle">FastAPI · server-sent events</text>

      <rect class="grp-fill" x="240" y="120" width="330" height="250" rx="10"/>
      <text class="gt" x="256" y="140">Agent loop</text>
      <rect class="box" x="260" y="150" width="290" height="44" rx="7"/>
      <text class="t" x="405" y="170" text-anchor="middle">Planner · Nemotron</text>
      <text class="s" x="405" y="186" text-anchor="middle">decides the next step from the evidence so far</text>
      <rect class="box" x="260" y="204" width="140" height="44" rx="7"/>
      <text class="t" x="330" y="222" text-anchor="middle">Budget guard</text>
      <text class="s" x="330" y="238" text-anchor="middle">Reasoning + job budgets</text>
      <rect class="box" x="410" y="204" width="140" height="44" rx="7"/>
      <text class="t" x="480" y="222" text-anchor="middle">Rate limiter</text>
      <text class="s" x="480" y="238" text-anchor="middle">Configured RPM − 2</text>
      <text class="gt" x="256" y="270">Meterless engines</text>
      <rect class="ext" x="260" y="278" width="92" height="74" rx="7"/>
      <text class="t" x="306" y="302" text-anchor="middle">World</text>
      <text class="t" x="306" y="317" text-anchor="middle">Model</text>
      <text class="s" x="306" y="334" text-anchor="middle">evidence +</text>
      <text class="s" x="306" y="346" text-anchor="middle">provenance</text>
      <rect class="ext" x="359" y="278" width="92" height="74" rx="7"/>
      <text class="t" x="405" y="302" text-anchor="middle">Markovian</text>
      <text class="s" x="405" y="322" text-anchor="middle">chunked</text>
      <text class="s" x="405" y="334" text-anchor="middle">carry-over,</text>
      <text class="s" x="405" y="346" text-anchor="middle">token savings</text>
      <rect class="ext" x="458" y="278" width="92" height="74" rx="7"/>
      <text class="t" x="504" y="302" text-anchor="middle">H-MEM</text>
      <text class="s" x="504" y="322" text-anchor="middle">company</text>
      <text class="s" x="504" y="334" text-anchor="middle">profiles, past</text>
      <text class="s" x="504" y="346" text-anchor="middle">investigations</text>

      <rect class="key" x="240" y="400" width="330" height="56" rx="8"/>
      <text class="t" x="405" y="423" text-anchor="middle">Checker</text>
      <text class="s" x="405" y="441" text-anchor="middle">recomputes every number · drops unsupported claims</text>

      <!-- Column C: tools -->
      <text class="gt" x="630" y="130">Tools</text>
      <rect class="box" x="630" y="140" width="200" height="40" rx="7"/><text class="t" x="642" y="164">Quality judge</text><text class="s" x="818" y="164" text-anchor="end">same facts?</text>
      <rect class="box" x="630" y="192" width="200" height="40" rx="7"/><text class="t" x="642" y="216">Speed probe</text><text class="s" x="818" y="216" text-anchor="end">TTFT · tokens/s</text>
      <rect class="box" x="630" y="244" width="200" height="40" rx="7"/><text class="t" x="642" y="268">Fix experiment</text><text class="s" x="818" y="268" text-anchor="end">re-run the bot</text>
      <rect class="box" x="630" y="296" width="200" height="40" rx="7"/><text class="t" x="642" y="320">Token meter</text><text class="s" x="818" y="320" text-anchor="end">indictax · 8</text>
      <rect class="box" x="630" y="348" width="200" height="40" rx="7"/><text class="t" x="642" y="372">Zetaris SQL</text><text class="s" x="818" y="372" text-anchor="end">read-only</text>

      <rect class="box" x="630" y="455" width="200" height="48" rx="7"/>
      <text class="t" x="730" y="476" text-anchor="middle">logs/</text>
      <text class="s" x="730" y="492" text-anchor="middle">JSONL audit for judges</text>

      <!-- Column D: NVIDIA and Zetaris -->
      <rect class="grp-fill" x="900" y="40" width="204" height="150" rx="10"/>
      <text class="gt" x="914" y="60">NVIDIA API</text>
      <rect class="ext" x="914" y="72" width="176" height="46" rx="7"/>
      <text class="t" x="1002" y="92" text-anchor="middle">Nemotron</text><text class="s" x="1002" y="108" text-anchor="middle">plans · judges quality</text>
      <rect class="ext" x="914" y="128" width="176" height="46" rx="7"/>
      <text class="t" x="1002" y="148" text-anchor="middle">Hosted models</text><text class="s" x="1002" y="164" text-anchor="middle">speed tests, fix re-runs</text>

      <rect class="grp-fill" x="900" y="230" width="204" height="200" rx="10"/>
      <text class="gt" x="914" y="250">Zetaris · one SQL</text>
      <rect class="ext" x="914" y="262" width="176" height="46" rx="7"/>
      <text class="t" x="1002" y="282" text-anchor="middle">Company DB</text><text class="s" x="1002" y="298" text-anchor="middle">bot config · chats</text>
      <rect class="ext" x="914" y="316" width="176" height="46" rx="7"/>
      <text class="t" x="1002" y="336" text-anchor="middle">Measurements</text><text class="s" x="1002" y="352" text-anchor="middle">token counts by part</text>
      <rect class="ext" x="914" y="370" width="176" height="46" rx="7"/>
      <text class="t" x="1002" y="390" text-anchor="middle">Reference</text><text class="s" x="1002" y="406" text-anchor="middle">parallel sentences · prices</text>

      <!-- Edges -->
      <path class="edge" d="M101 100 V170" marker-end="url(#ar)"/>
      <text class="lab" x="108" y="130">question</text>
      <text class="lab" x="108" y="144">chats · volume</text>

      <path class="edge" d="M186 190 H213 V65 H240" marker-end="url(#ar)"/>
      <text class="lab" x="216" y="59">ask</text>
      <path class="edge-t" d="M240 82 H226 V232 H186" marker-end="url(#ar)" style="color:#1C6770"/>
      <text class="lab" x="108" y="270" fill="#1C6770">live steps (SSE)</text>

      <path class="edge" d="M405 90 V120" marker-end="url(#ar)"/>
      <text class="lab" x="412" y="110">run</text>

      <path class="edge-a" d="M550 158 H585 V24 H1002 V72" marker-end="url(#ar)" style="color:#A86A12"/>
      <text class="lab-a" x="760" y="18" text-anchor="middle">plan · decide · through the rate limiter</text>

      <path class="edge" d="M550 180 H600 V368"/>
      <path class="edge" d="M600 160 H630" marker-end="url(#ar)"/>
      <path class="edge" d="M600 212 H630" marker-end="url(#ar)"/>
      <path class="edge" d="M600 264 H630" marker-end="url(#ar)"/>
      <path class="edge" d="M600 316 H630" marker-end="url(#ar)"/>
      <path class="edge" d="M600 368 H630" marker-end="url(#ar)"/>
      <text class="lab" x="556" y="198">tool calls</text>
      <path class="edge-t" d="M600 330 H572" marker-end="url(#ar)" style="color:#1C6770"/>
      <text class="lab" x="574" y="346" fill="#1C6770">results</text>

      <path class="edge" d="M830 160 H865 M830 212 H865 M830 264 H865 M865 264 V146 H900" marker-end="url(#ar)"/>
      <text class="lab" x="836" y="138">model calls</text>
      <path class="edge" d="M830 368 H900" marker-end="url(#ar)"/>
      <text class="lab" x="838" y="360">SQL/REST</text>

      <path class="edge-t" d="M306 352 V400" marker-end="url(#ar)" style="color:#1C6770"/>
      <text class="lab" x="312" y="382" fill="#1C6770">evidence</text>
      <path class="edge-a" d="M240 428 H101 V250" marker-end="url(#ar)" style="color:#A86A12"/>
      <text class="lab-a" x="110" y="420">verified report</text>
      <path class="edge-d" d="M570 440 H600 V479 H630" marker-end="url(#ar)" style="color:#56666F"/>
      <path class="edge-d" d="M730 388 V455" marker-end="url(#ar)" style="color:#56666F"/>
      <text class="lab" x="738" y="426">every call</text>
    </svg>
